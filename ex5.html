<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Carousel</title>

    <style>
        img {
            width: 300px;
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <h2>My Image Gallery</h2>

    <img id="image" src="image1.jpg" alt="Gallery image">

    <br><br>

    <button onclick="previous()">Previous</button>
    <button onclick="next()">Next</button>

    <script>
        let images = [
            "fl1.webp",
            "fl2.webp",
            "fl3.webp"
        ];

        let index = 0;

        function next() {
            index++;

            if (index >= images.length) {
                index = 0;
            }

            document.getElementById("image").src = images[index];
        }

        function previous() {
            index--;

            if (index < 0) {
                index = images.length - 1;
            }

            document.getElementById("image").src = images[index];
        }
    </script>

</body>
</html>
