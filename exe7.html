<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Timer</title>
</head>
<body>

    <h2>TIMER</h2>

    <p id="timer">0 seconds</p>

    <script>
        let seconds = 0;

        setInterval(function() {
            seconds++;

            document.getElementById("timer").textContent =
                seconds + " seconds";
        });
    </script>

</body>
</html>
