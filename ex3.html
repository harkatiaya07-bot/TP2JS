<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Validation</title>
</head>
<body>

    <h2>Form</h2>

    <form onsubmit="return validateForm()">
        <label>Name:</label>
        <input type="text" id="name">
        <br><br>

        <label>Email:</label>
        <input type="text" id="email">
        <br><br>

        <button type="submit">Submit</button>
    </form>

    <p id="message"></p>

    <script>
        function validateForm() {
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;

            if (name == "" ,  email == "") {
                document.getElementById("message").textContent ="Please fill in the fields.";
                return false;
            } else {
                document.getElementById("message").textContent = "Form validated successfully!";
                return false;
            }
        }
    </script>

</body>
</html>
