<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product List</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        input {
            padding: 10px;
            width: 250px;
        }

        ul {
            padding: 0;
            list-style: none;
        }

        li {
            
            padding : 10px;
            margin : 5px;
            width : 250px;
        }
    </style>
</head>
<body>

    <h2>Product List</h2>

    <input type="text" placeholder="Search for a product...">

    <ul>
        <li>Pen</li>
        <li>Book</li>
        <li>Notebook</li>
        <li>ruler</li>
        <li>pencil</li>
        <li>eraser</li>
    </ul>



</body>
</html>
