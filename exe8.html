<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mouse move</title>

    <style>
        #myDiv {
            width: 300px;
            height: 150px;
            background-color: rgb(15, 198, 15);
            text-align: center;
            line-height: 150px;
        }

        #myDiv:hover {
            background-color: rgb(211, 178, 47);
        }
    </style>
</head>
<body>

    <h2>Mouse Events</h2>

    <div id="myDiv">
        Move your mouse here!
    </div>

</body>
</html>
