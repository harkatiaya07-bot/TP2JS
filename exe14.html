<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drag and Drop</title>

    <style>
        .container {
            display: flex;
            gap: 20px;
        }

        .box {
            width: 200px;
            height: 200px;
            border: 2px solid black;
            padding: 10px;
        }

        .item {
            background-color: rgb(231, 136, 188);
            padding: 15px;
            
        }
    </style>
</head>
<body>

    <h2>Drag and Drop</h2>

    <div class="container">

        <div class="box">
            <p>Box 1</p>
            <div class="item">Drag me!</div>
        </div>

        <div class="box">
            <p>Box 2</p>
        </div>

    </div>

</body>
</html>
